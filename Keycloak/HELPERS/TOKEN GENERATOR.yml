    data:
      - name: grant_type
        value: client_credentials
      - name: client_id
        value: scim-client
      - name: client_secret
        value: lp1q7DnMwegYFKksuEvTB55mzzI6LMkn
      - name: name
        value: scim-provisioning

runtime:
